<header>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/home" (click)="isMenuOpen.set(false)">
        <span class="brand-accent">resto</span>money$
      </a>
      
      <button
        class="navbar-toggler"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" [class.show]="isMenuOpen()" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/home"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="isMenuOpen.set(false)"
              >Home</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/menu"
              routerLinkActive="active"
              (click)="isMenuOpen.set(false)"
              >Menu</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/cart"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="isMenuOpen.set(false)"
              >Cart</a
            >
          </li>
          @if (!isLoggedIn()) {
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/login"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                (click)="isMenuOpen.set(false)"
                >Log In</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/register"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                (click)="isMenuOpen.set(false)"
                >Register</a
              >
            </li>
          } @else {
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/profile"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                (click)="isMenuOpen.set(false)"
                >Profile</a
              >
            </li>
            <li class="nav-item">
              <button class="nav-link" (click)="logout()">Log Out</button>
            </li>
          }
        </ul>
      </div>
    </div>
  </nav>
</header>
