<div class="auth-page-container">
  <div class="auth-card">
    <h2 class="auth-heading">Welcome Back</h2>
    <p class="auth-subheading">Log in to manage your restomoney$ account</p>
    
    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" [formControl]="loginForm.controls.email" placeholder="name@example.com" />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" [formControl]="loginForm.controls.password" placeholder="••••••••" />
      </div>

      <button type="submit" class="btn-auth-submit">Log In</button>
    </form>
  </div>
</div>
