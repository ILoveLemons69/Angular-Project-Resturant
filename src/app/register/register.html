<div class="auth-page-container">
  <div class="auth-card">
    <h2 class="auth-heading">Create Account</h2>
    <p class="auth-subheading">Get started with your restomoney$ account</p>
    
    <form [formGroup]="registerForm" (ngSubmit)="submit()">
      <div class="form-row-grid">
        <div class="input-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" [formControl]="registerForm.controls.firstName" placeholder="Guram" />
        </div>

        <div class="input-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" [formControl]="registerForm.controls.lastName" placeholder="Nibladze" />
        </div>
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" [formControl]="registerForm.controls.email" placeholder="name@example.com" />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" [formControl]="registerForm.controls.password" placeholder="••••••••" />
      </div>

      <button type="submit" class="btn-auth-submit">Register</button>
    </form>
  </div>
</div>
